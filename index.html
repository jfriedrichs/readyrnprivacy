<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadyRN</title>
  <meta name="description" content="ReadyRN, an NCLEX-RN study app for nursing students.">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <style>
    :root { --bg: #f4f6fa; --text: #182033; --muted: #5b6579; --primary: #1f5fbf; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1420; --text: #e6eaf2; --muted: #9aa4b8; --primary: #6ea1f0; color-scheme: dark; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 1rem; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { margin: 0.75rem 0 0.25rem; }
    p { color: var(--muted); margin: 0 0 1rem; }
    a { color: var(--primary); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="ReadyRN app icon">
    <h1>ReadyRN</h1>
    <p>NCLEX-RN practice questions, topic review and adaptive exam simulations.</p>
    <a href="privacy.html">Privacy Policy</a>
  </main>
</body>
</html>
